<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://copilot.microsoft.com/th/id/BCO.8a1f9d2e-unique-employee-logout.png') no-repeat center center fixed;
            background-size: cover;
        }
        .logout-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            width: 360px;
            text-align: center;
        }
        .logout-container h2 {
            color: #003366;
            margin-bottom: 20px;
        }
        .logout-container p {
            font-size: 15px;
            color: #333;
            margin-bottom: 25px;
        }
        .logout-container a {
            display: inline-block;
            padding: 12px 20px;
            background: #003366;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .logout-container a:hover {
            background: #0055aa;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2>You have been logged out</h2>
        <p>Thank you for using the Employee System. Please log in again to continue.</p>
        <a href="/login.html">Back to Login</a>
    </div>
</body>
</html>
